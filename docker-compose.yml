version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # WP1: Optical Monitoring & Ingestion (Zig Zero-Copy PCIe Ingress + PQC Shield)
  # ----------------------------------------------------------------------------
  aeterna-ingress-wp1:
    container_name: aeterna-qstn-ingress
    build:
      context: .
      dockerfile: docker/Dockerfile.ingress
    environment:
      - SAMPLING_FREQ_HZ=10000
      - PHASE_RESOLUTION_URAD=1
      - SPATIAL_RESOLUTION_M=2.0
      - COHERENCE_LENGTH_KM=100
      - ZIG_STREAM_MODULE=SOP_STREAM_ACQUISITION.zig
      - PQC_PRIMITIVES=NIST_ML_KEM_1024_ML_DSA_87
    volumes:
      - ./assets/subsea_telemetry_samples:/data:ro
    networks:
      - aeterna_sovereign_bus
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # WP2: Mojo Real-Time Signal Processing & O(1) Neural Classifier
  # ----------------------------------------------------------------------------
  aeterna-mojo-wp2:
    container_name: aeterna-qstn-mojo-classifier
    build:
      context: .
      dockerfile: docker/Dockerfile.mojo
    environment:
      - INFERENCE_TARGET_LATENCY_MS=1.14
      - VECTOR_MATH_MODE=SIMD_AVX512_INT
      - CLASSIFIER_SCRIPT=scripts/simulation.mojo
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - aeterna-ingress-wp1
    networks:
      - aeterna_sovereign_bus
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # WP3: Kernel-Level eBPF Sentinel & AIGIS Dome SCADA Hardening
  # ----------------------------------------------------------------------------
  aeterna-sentinel-wp3:
    container_name: aeterna-qstn-ebpf-sentinel
    build:
      context: .
      dockerfile: docker/Dockerfile.sentinel
    privileged: true
    cap_add:
      - SYS_ADMIN
      - BPF
      - NET_ADMIN
    environment:
      - APOPTOSIS_TRIGGER_LATENCY_MAX_MS=1.02
      - SCADA_DOME_PORT=3847
      - INT_ONLY_MATH=TRUE
    depends_on:
      - aeterna-mojo-wp2
    networks:
      - aeterna_sovereign_bus
    restart: unless-stopped

  # ----------------------------------------------------------------------------
  # WP4: HELIOS Sovereign Presentation & Tactical HUD Plane
  # ----------------------------------------------------------------------------
  aeterna-helios-hud:
    container_name: aeterna-qstn-helios-hud
    build:
      context: .
      dockerfile: docker/Dockerfile.hud
    ports:
      - "8080:80"
      - "3847:3847"
    environment:
      - HUD_MODE=SOVEREIGN_TACTICAL_DEFENSE
      - LIVE_TELEMETRY_REFRESH_HZ=60
      - SHIELD_STATUS=ACTIVE_VERIFIED
    depends_on:
      - aeterna-sentinel-wp3
    networks:
      - aeterna_sovereign_bus
    restart: unless-stopped

networks:
  aeterna_sovereign_bus:
    name: aeterna_qstn_internal_mesh
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16
